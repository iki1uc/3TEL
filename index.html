<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>3TEL · QUEST · ALLE ZAHLEN · EXTRAKTOR</title>

<style>
:root {
    --bg: #0a0a0f;
    --fg: #0f0;
    --gold: #ffd700;
    --l1: #ff6b6b;
    --l2: #6bff6b;
    --l3: #6b6bff;
    --l4: #ffd93d;
    --l5: #ff44ff;
    --l6: #6cf;
    --l7: #ff8c00;
    --err: #ff3333;
    --warn: #ffaa00;
    --ok: #44ff44;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
    background: var(--bg);
    color: var(--fg);
    font-family: 'Consolas', monospace;
    min-height: 100vh;
    overflow: hidden;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 4px;
    padding: 8px;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    border-bottom: 2px solid var(--gold);
    padding-bottom: 4px;
    flex-wrap: wrap;
    gap: 4px;
}
header h1 {
    font-size: 13px;
    color: var(--gold);
    letter-spacing: 2px;
}
header h1 .quest { color: var(--l4); }
header h1 .num { color: var(--l1); }
header h1 .ext { color: var(--l2); }
#info-bar { font-size: 8px; color: #666; display: flex; gap: 6px; align-items: center; }

main {
    display: grid;
    grid-template-columns: 3fr 1.2fr;
    gap: 4px;
    height: 100%;
    min-height: 0;
}

#canvas-wrap {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 8px;
    padding: 4px;
    position: relative;
    overflow: hidden;
}
#canvas-wrap canvas {
    width: 100%;
    height: 100%;
    border-radius: 4px;
    display: block;
}
#canvas-overlay {
    position: absolute;
    bottom: 8px;
    left: 8px;
    font-size: 7px;
    color: #444;
    pointer-events: none;
    background: rgba(0,0,0,0.7);
    padding: 3px 8px;
    border-radius: 3px;
}
#canvas-overlay .ok { color: var(--ok); }
#canvas-overlay .num { color: var(--l1); }

#panel {
    background: #0a0a0f;
    border: 1px solid #1a1a2a;
    border-radius: 8px;
    padding: 4px;
    display: flex;
    flex-direction: column;
    gap: 2px;
    overflow-y: auto;
    max-height: 100%;
    font-size: 8px;
}
#panel h3 { font-size: 8px; color: #666; border-bottom: 1px solid #1a1a2a; padding-bottom: 2px; }

#log {
    flex: 1;
    overflow-y: auto;
    font-size: 7px;
    color: #6a6a8a;
    line-height: 1.2;
    min-height: 30px;
    max-height: 60px;
    background: #06060a;
    border-radius: 3px;
    padding: 2px 4px;
}
#log .entry { padding: 1px 0; border-bottom: 1px solid #0a0a12; }
#log .time { color: #444; }
#log .msg.ok { color: var(--ok); }
#log .msg.num { color: var(--l1); }
#log .msg.ext { color: var(--l2); }

#metrics {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr 1fr;
    gap: 2px;
}
.metric {
    background: #0e0e1a;
    border-radius: 3px;
    padding: 2px 3px;
    text-align: center;
    border: 1px solid #1a1a2a;
}
.metric .label { color: #666; font-size: 5px; text-transform: uppercase; }
.metric .value { font-size: 9px; font-weight: bold; }
.metric.num .value { color: var(--l1); }
.metric.ext .value { color: var(--l2); }
.metric.quest .value { color: var(--l4); }

#controls {
    display: flex;
    gap: 2px;
    flex-wrap: wrap;
}
button {
    background: #111;
    color: var(--fg);
    border: 1px solid #333;
    padding: 2px 6px;
    border-radius: 2px;
    cursor: pointer;
    font-family: inherit;
    font-size: 7px;
    transition: all 0.2s;
}
button:hover { background: #1a1a2a; border-color: var(--gold); }
button:active { transform: scale(0.95); }
button.primary { border-color: var(--gold); color: var(--gold); }
button.primary:hover { background: var(--gold); color: #000; }
button.quest { border-color: var(--l4); color: var(--l4); }
button.quest:hover { background: var(--l4); color: #000; }
button.danger { border-color: var(--err); color: var(--err); }
button.danger:hover { background: var(--err); color: #000; }

@media (max-width: 800px) {
    main { grid-template-columns: 1fr; }
    #panel { max-height: 180px; }
}
</style>
</head>

<body>

<header>
    <h1>
        <span class="quest">◈ 3TEL</span>
        <span style="color:#666;">·</span>
        <span class="num">🔢 QUEST</span>
        <span style="color:#666;">·</span>
        <span class="ext">⚡ EXTRAKTOR</span>
    </h1>
    <div id="info-bar">
        <span id="clock">⏱️ --:--:--</span>
        <span id="state-display" style="color:var(--gold);">● bereit</span>
        <span id="cycle-display" style="color:#666;">QUEST 0</span>
    </div>
</header>

<main>
    <div id="canvas-wrap">
        <canvas id="questCanvas"></canvas>
        <div id="canvas-overlay">
            <span class="ok">●</span> 3TEL · <span class="num">🔢</span> Alle Zahlen extrahiert
        </div>
    </div>

    <div id="panel">
        <h3>📊 ALLE ZAHLEN · 3TEL-QUEST</h3>

        <div id="metrics">
            <div class="metric num"><div class="label">3TEL</div><div class="value" id="tel3-value">0</div></div>
            <div class="metric ext"><div class="label">4TEL</div><div class="value" id="tel4-value">0</div></div>
            <div class="metric quest"><div class="label">QUEST</div><div class="value" id="quest-value">0</div></div>
            <div class="metric num"><div class="label">φ</div><div class="value" id="phi-value">0.00</div></div>
        </div>

        <div id="log">
            <div class="entry"><span class="time">[INIT]</span> <span class="msg ok">◈ 3TEL · QUEST · EXTRAKTOR</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg num">ARG · XARG · ARG3TE → FullSync → 4TEL</span></div>
            <div class="entry"><span class="time">[INIT]</span> <span class="msg ext">α, β, γ, δ · Energie, Impuls, Feld, Zentrumskraft</span></div>
        </div>

        <div id="controls">
            <button class="primary" id="btn-start">▶ START</button>
            <button class="quest" id="btn-quest">🔢 QUEST</button>
            <button class="danger" id="btn-reset">⟲ RESET</button>
            <button id="btn-auto">▶ AUTO</button>
        </div>
    </div>
</main>

<script>
// ============================================================
// 1. 3TEL · QUEST · EXTRAKTOR
// ============================================================

// --- KONSTANTEN ---
const PHI = 1.61803398875;
const PHI_INV = 1 / PHI;

// --- 3TEL-KERN ---
const TEL3 = {
    // Segmente
    segments: {
        HY:  ["◉","3","9","◎","81","3","↺"],
        PE:  ["◉","9","◎","81","◆","△","▣"],
        PER: ["3","9","81","◆","756","△","27","▣","3"],
        TRANS:["◎","81","◆","△"],
        WARB:["81","◆","△","27"],
        KANAL:["756","△","27","▣"],
        TMPa:["3","◎","27"],
        TMPb:["9","81","▣"],
        TMPg:["◆","756","△"]
    },

    // 3TEL = erste drei Elemente
    tri: function(segment) {
        const s = this.segments[segment] || this.segments.PER;
        return s.slice(0, 3);
    },

    // 4TEL = 3TEL + ◎
    quad: function(tri) {
        return [...tri, '◎'];
    },

    // Alle Zahlen aus Segment extrahieren
    extractNumbers: function(segment) {
        const s = this.segments[segment] || this.segments.PER;
        const numbers = s.filter(item => !isNaN(parseFloat(item)) && isFinite(item));
        return numbers.map(Number);
    },

    // Alle Symbole aus Segment extrahieren
    extractSymbols: function(segment) {
        const s = this.segments[segment] || this.segments.PER;
        return s.filter(item => isNaN(parseFloat(item)) || !isFinite(item));
    }
};

// --- GEO-Physik ---
function geoPhysik(tri, quad) {
    const map = {
        '◉': 1, '3': 3, '9': 9, '◎': 1, '81': 81,
        '◆': 7, '△': 11, '▣': 13, '27': 27, '756': 756
    };

    const alpha = map[tri[0]] || 1;
    const beta = map[tri[1]] || 1;
    const gamma = map[tri[2]] || 1;
    const delta = map[quad[3]] || 1;

    return {
        alpha, beta, gamma, delta,
        energie: alpha * 9.81,
        impuls: beta * gamma,
        feld: gamma * 42,
        zentrumskraft: delta * 108
    };
}

// --- VEKTEL ---
function vektel(tri, quad) {
    return {
        v1: tri[0] || '◉',
        v2: quad[quad.length - 1] || '▣',
        v3: (tri[1] || '3') + '→' + (quad[2] || '81')
    };
}

// ============================================================
// 2. CANVAS SETUP
// ============================================================
const canvas = document.getElementById('questCanvas');
const ctx = canvas.getContext('2d');
let W, H, cx, cy, radius;

function resizeCanvas() {
    const wrap = document.getElementById('canvas-wrap');
    const rect = wrap.getBoundingClientRect();
    canvas.width = rect.width;
    canvas.height = rect.height;
    W = canvas.width; H = canvas.height;
    cx = W / 2; cy = H / 2;
    radius = Math.min(W, H) * 0.38;
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

// ============================================================
// 3. STATE
// ============================================================
const state = {
    running: false,
    paused: false,
    autoMode: false,
    cycle: 0,
    t: 0,

    // Segment
    segment: 'PER',
    tri: ['3', '9', '81'],
    quad: ['3', '9', '81', '◎'],

    // Zahlen
    numbers: [3, 9, 81, 756, 27],
    symbols: ['◆', '△', '▣', '↺'],

    // GEO-Physik
    geo: { alpha: 3, beta: 9, gamma: 81, delta: 1 },
    phys: { energie: 29.43, impuls: 729, feld: 3402, zentrumskraft: 108 },

    // VEKTEL
    vektel: { v1: '3', v2: '◎', v3: '9→81' },

    // SYN/QUANT/RESPO
    syn: 0.5,
    quant: 0.5,
    respo: 0.5,

    // Quest-Zahlen
    quest: 0
};

// ============================================================
// 4. LOG
// ============================================================
function log(msg, type = 'info') {
    const logDiv = document.getElementById('log');
    const entry = document.createElement('div');
    entry.className = 'entry';
    const time = new Date().toLocaleTimeString();
    const cls = type === 'ok' ? 'ok' : type === 'num' ? 'num' : type === 'ext' ? 'ext' : '';
    entry.innerHTML = `<span class="time">[${time}]</span> <span class="msg ${cls}">${msg}</span>`;
    logDiv.appendChild(entry);
    logDiv.scrollTop = logDiv.scrollHeight;
    while (logDiv.children.length > 50) logDiv.removeChild(logDiv.firstChild);
}

// ============================================================
// 5. 3TEL · QUEST
// ============================================================

function updateQuest(segment) {
    // 3TEL
    const tri = TEL3.tri(segment);
    const quad = TEL3.quad(tri);
    const numbers = TEL3.extractNumbers(segment);
    const symbols = TEL3.extractSymbols(segment);

    state.tri = tri;
    state.quad = quad;
    state.numbers = numbers;
    state.symbols = symbols;

    // GEO-Physik
    const geo = geoPhysik(tri, quad);
    state.geo = geo;
    state.phys = {
        energie: geo.energie,
        impuls: geo.impuls,
        feld: geo.feld,
        zentrumskraft: geo.zentrumskraft
    };

    // VEKTEL
    const vek = vektel(tri, quad);
    state.vektel = vek;

    // RESPO
    state.respo = computeRespo(state.syn, state.quant);

    // Quest-Zahl = Summe aller Zahlen
    state.quest = numbers.reduce((a, b) => a + b, 0);

    // Metriken
    document.getElementById('tel3-value').textContent = tri.join(' ');
    document.getElementById('tel4-value').textContent = quad.join(' ');
    document.getElementById('quest-value').textContent = state.quest;
    document.getElementById('phi-value').textContent = state.respo.toFixed(3);

    log(`🔢 QUEST: ${segment} | Zahlen: ${numbers.join(', ')} | Summe: ${state.quest}`, 'num');
    log(`📐 GEO: α=${geo.alpha} β=${geo.beta} γ=${geo.gamma} δ=${geo.delta}`, 'ext');
}

function computeRespo(syn, quant) {
    return Math.min(1, (syn + quant) / PHI);
}

// ============================================================
// 6. RENDER
// ============================================================
function render() {
    if (state.paused) {
        requestAnimationFrame(render);
        return;
    }

    ctx.clearRect(0, 0, W, H);

    // Hintergrund
    const grad = ctx.createRadialGradient(cx, cy, 10, cx, cy, W * 0.6);
    grad.addColorStop(0, '#0a0a1a');
    grad.addColorStop(1, '#000');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);

    // 1. 3TEL-Segment
    drawTel3();

    // 2. Zahlen extrahieren
    drawNumbers();

    // 3. GEO-Physik
    drawGeoPhysik();

    // 4. RESPO-Kern
    drawRespo();

    // 5. SYN/QUANT
    drawSynQuant();

    // Update
    state.t += 0.008;
    if (state.running) {
        state.cycle++;
        state.syn = 0.5 + 0.4 * Math.sin(state.t * 0.3);
        state.quant = 0.5 + 0.4 * Math.cos(state.t * 0.25);
        state.respo = computeRespo(state.syn, state.quant);

        // Alle 30 Zyklen neues Segment
        if (state.cycle % 30 === 0) {
            const segments = ['HY', 'PE', 'PER', 'TRANS', 'WARB', 'KANAL', 'TMPa', 'TMPb', 'TMPg'];
            const idx = Math.floor(Math.random() * segments.length);
            updateQuest(segments[idx]);
        }
    }

    if (state.cycle % 15 === 0) {
        document.getElementById('cycle-display').textContent = `QUEST ${state.cycle}`;
    }

    requestAnimationFrame(render);
}
render();

// ============================================================
// 7. ZEICHEN-FUNKTIONEN
// ============================================================

function drawTel3() {
    const tri = state.tri;
    const quad = state.quad;
    const r = radius * 0.35;

    // 3TEL-Kreis
    ctx.strokeStyle = 'rgba(255, 215, 61, 0.05)';
    ctx.lineWidth = 1;
    ctx.setLineDash([2, 4]);
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.stroke();
    ctx.setLineDash([]);

    // 3TEL Elemente (3)
    const colors = ['#ff6b6b', '#6bff6b', '#6b6bff'];
    tri.forEach((symbol, i) => {
        const angle = (i / 3) * Math.PI * 2 + state.t * 0.05 - Math.PI / 2;
        const dist = r * 0.6;
        const x = cx + Math.cos(angle) * dist;
        const y = cy + Math.sin(angle) * dist;

        ctx.strokeStyle = colors[i % colors.length] + '66';
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.arc(x, y, 18, 0, Math.PI * 2);
        ctx.stroke();

        ctx.fillStyle = colors[i % colors.length] + '44';
        ctx.shadowColor = colors[i % colors.length];
        ctx.shadowBlur = 10;
        ctx.beginPath();
        ctx.arc(x, y, 10, 0, Math.PI * 2);
        ctx.fill();
        ctx.shadowBlur = 0;

        ctx.fillStyle = '#fff';
        ctx.font = '14px Consolas';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.fillText(symbol, x, y);
    });

    // 4TEL Element (◎) – Zentrum
    ctx.fillStyle = 'rgba(255, 215, 61, 0.15)';
    ctx.font = '28px Consolas';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◎', cx, cy);

    // Verbindungen
    const centers = tri.map((_, i) => {
        const angle = (i / 3) * Math.PI * 2 + state.t * 0.05 - Math.PI / 2;
        return { x: cx + Math.cos(angle) * r * 0.6, y: cy + Math.sin(angle) * r * 0.6 };
    });
    centers.forEach(p => {
        ctx.strokeStyle = 'rgba(255,215,61,0.05)';
        ctx.lineWidth = 0.5;
        ctx.beginPath();
        ctx.moveTo(cx, cy);
        ctx.lineTo(p.x, p.y);
        ctx.stroke();
    });

    // Label
    ctx.fillStyle = '#666';
    ctx.font = '4px Consolas';
    ctx.textBaseline = 'top';
    ctx.fillText('3TEL → 4TEL', cx, cy + 36);
}

function drawNumbers() {
    const numbers = state.numbers;
    const r = radius * 0.55;

    if (numbers.length === 0) return;

    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(8, 8, 200, 16 + numbers.length * 10);

    ctx.fillStyle = '#ff6b6b66';
    ctx.font = '5px Consolas';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`🔢 Zahlen: ${numbers.join(', ')}`, 12, 10);

    // Summe
    const sum = numbers.reduce((a, b) => a + b, 0);
    ctx.fillStyle = '#ffd93d66';
    ctx.fillText(`Summe: ${sum}`, 12, 22);

    // Prozente
    if (numbers.length > 0) {
        const total = numbers.reduce((a, b) => a + b, 0);
        numbers.forEach((n, i) => {
            const pct = (n / total * 100).toFixed(1);
            ctx.fillStyle = `rgba(255,215,61,${0.1 + 0.1 * (i / numbers.length)})`;
            ctx.fillText(`${n} = ${pct}%`, 12, 34 + i * 10);
        });
    }

    // Extraktions-Balken
    const barX = 12, barY = 34 + numbers.length * 10;
    const barW = 80, barH = 4;
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(barX, barY, barW, barH);
    const pct = Math.min(1, numbers.length / 9);
    ctx.fillStyle = '#ffd93d';
    ctx.fillRect(barX, barY, barW * pct, barH);
    ctx.fillStyle = '#666';
    ctx.font = '4px Consolas';
    ctx.fillText(`${(pct * 100).toFixed(0)}% extrahiert`, barX + 84, barY - 1);
}

function drawGeoPhysik() {
    const geo = state.geo;
    const phys = state.phys;
    const r = radius * 0.55;

    // GEO-Werte
    ctx.fillStyle = 'rgba(255,255,255,0.02)';
    ctx.fillRect(W - 140, 8, 132, 50);

    ctx.fillStyle = '#ff6b6b66';
    ctx.font = '4px Consolas';
    ctx.textAlign = 'left';
    ctx.textBaseline = 'top';
    ctx.fillText(`α=${geo.alpha} β=${geo.beta} γ=${geo.gamma} δ=${geo.delta}`, W - 136, 10);

    ctx.fillStyle = '#6b6bff66';
    ctx.fillText(`E=${phys.energie.toFixed(1)} I=${phys.impuls.toFixed(1)}`, W - 136, 22);

    ctx.fillStyle = '#6bff6b66';
    ctx.fillText(`F=${phys.feld.toFixed(1)} Z=${phys.zentrumskraft.toFixed(1)}`, W - 136, 34);

    // Energie-Balken
    const maxE = 8000;
    const pct = Math.min(1, phys.energie / maxE);
    ctx.fillStyle = '#1a1a2a';
    ctx.fillRect(W - 136, 46, 100, 3);
    ctx.fillStyle = '#ff6b6b';
    ctx.fillRect(W - 136, 46, 100 * pct, 3);
}

function drawRespo() {
    const val = state.respo;
    const coreRadius = 3 + val * 10;

    const glow = ctx.createRadialGradient(cx, cy, 0, cx, cy, coreRadius + 10);
    glow.addColorStop(0, `rgba(108, 204, 255, ${0.1 + val * 0.2})`);
    glow.addColorStop(1, 'rgba(108, 204, 255, 0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius + 10, 0, Math.PI * 2);
    ctx.fill();

    const coreGrad = ctx.createRadialGradient(cx - 2, cy - 2, 0, cx, cy, coreRadius);
    coreGrad.addColorStop(0, `rgba(108, 204, 255, ${0.4 + val * 0.4})`);
    coreGrad.addColorStop(0.7, `rgba(60, 180, 220, ${0.2 + val * 0.3})`);
    coreGrad.addColorStop(1, `rgba(40, 120, 180, ${0.1 + val * 0.2})`);
    ctx.fillStyle = coreGrad;
    ctx.shadowColor = '#6cf';
    ctx.shadowBlur = 6 + val * 10;
    ctx.beginPath();
    ctx.arc(cx, cy, coreRadius, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;

    ctx.fillStyle = '#000';
    ctx.font = `bold ${4 + val * 4}px Consolas`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('◈', cx, cy);

    ctx.fillStyle = `rgba(255, 255, 255, ${0.1 + val * 0.2})`;
    ctx.font = '4px Consolas';
    ctx.textBaseline = 'top';
    ctx.fillText(`φ = ${state.respo.toFixed(3)}`, cx, cy + coreRadius + 4);
}

function drawSynQuant() {
    const syn = state.syn;
    const quant = state.quant;
    const r = radius * 0.06;

    const sx = cx - r * 0.6;
    const sy = cy + r * 0.15;
    ctx.fillStyle = `rgba(255, 107, 107, ${0.1 + syn * 0.2})`;
    ctx.shadowColor = '#ff6b6b';
    ctx.shadowBlur = 2 + syn * 4;
    ctx.beginPath();
    ctx.arc(sx, sy, 1 + syn * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(255, 107, 107, ${0.1 + syn * 0.2})`;
    ctx.font = '3px Consolas';
    ctx.textAlign = 'center';
    ctx.fillText(`SYN ${(syn * 100).toFixed(0)}%`, sx, sy - 6);

    const qx = cx + r * 0.6;
    const qy = cy + r * 0.15;
    ctx.fillStyle = `rgba(107, 107, 255, ${0.1 + quant * 0.2})`;
    ctx.shadowColor = '#6b6bff';
    ctx.shadowBlur = 2 + quant * 4;
    ctx.beginPath();
    ctx.arc(qx, qy, 1 + quant * 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.shadowBlur = 0;
    ctx.fillStyle = `rgba(107, 107, 255, ${0.1 + quant * 0.2})`;
    ctx.fillText(`QUANT ${(quant * 100).toFixed(0)}%`, qx, qy - 6);
}

// ============================================================
// 8. CONTROLS
// ============================================================
document.getElementById('btn-start').addEventListener('click', function() {
    state.running = !state.running;
    this.textContent = state.running ? '⏸ STOP' : '▶ START';
    document.getElementById('state-display').textContent = state.running ? '● läuft' : '● gestoppt';
    document.getElementById('state-display').style.color = state.running ? 'var(--gold)' : '#666';
    log(state.running ? '▶ QUEST gestartet' : '⏸ QUEST gestoppt', 'ok');
});

document.getElementById('btn-quest').addEventListener('click', function() {
    const segments = ['HY', 'PE', 'PER', 'TRANS', 'WARB', 'KANAL', 'TMPa', 'TMPb', 'TMPg'];
    const idx = Math.floor(Math.random() * segments.length);
    updateQuest(segments[idx]);
    log(`🔢 QUEST: ${segments[idx]} | Summe: ${state.quest}`, 'num');
});

document.getElementById('btn-reset').addEventListener('click', function() {
    state.running = false;
    state.paused = false;
    state.cycle = 0;
    state.t = 0;
    state.syn = 0.5;
    state.quant = 0.5;
    state.respo = 0.5;
    state.quest = 0;
    updateQuest('PER');
    document.getElementById('btn-start').textContent = '▶ START';
    document.getElementById('state-display').textContent = '● reset';
    document.getElementById('state-display').style.color = '#f44';
    document.getElementById('cycle-display').textContent = 'QUEST 0';
    log('⟲ RESET — QUEST zurückgesetzt', 'ok');
});

document.getElementById('btn-auto').addEventListener('click', function() {
    state.autoMode = !state.autoMode;
    this.textContent = state.autoMode ? '⏸ PAUSE' : '▶ AUTO';
    if (state.autoMode) {
        log('▶ AUTO · QUEST wechselt', 'ok');
        state.running = true;
        document.getElementById('btn-start').textContent = '⏸ STOP';
        document.getElementById('state-display').textContent = '● auto';
        document.getElementById('state-display').style.color = 'var(--gold)';
        if (window.autoInterval) clearInterval(window.autoInterval);
        window.autoInterval = setInterval(function() {
            state.cycle++;
            document.getElementById('cycle-display').textContent = `QUEST ${state.cycle}`;
            const segments = ['HY', 'PE', 'PER', 'TRANS', 'WARB', 'KANAL', 'TMPa', 'TMPb', 'TMPg'];
            const idx = Math.floor(Math.random() * segments.length);
            updateQuest(segments[idx]);
            log(`🔄 Zyklus ${state.cycle}: ${segments[idx]} | Summe: ${state.quest}`, 'num');
        }, 4000);
    } else {
        clearInterval(window.autoInterval);
        log('⏸ AUTO pausiert', 'ok');
        document.getElementById('state-display').textContent = '● pausiert';
        document.getElementById('state-display').style.color = '#ff4';
    }
});

// ============================================================
// 9. TASTATUR
// ============================================================
document.addEventListener('keydown', function(e) {
    if (e.key === ' ') { e.preventDefault(); document.getElementById('btn-start').click(); }
    if (e.key === 'q' || e.key === 'Q') document.getElementById('btn-quest').click();
    if (e.key === 'x' || e.key === 'X') document.getElementById('btn-reset').click();
    if (e.key === 'a' || e.key === 'A') document.getElementById('btn-auto').click();
});

// ============================================================
// 10. UHR
// ============================================================
function updateClock() {
    document.getElementById('clock').textContent = '⏱️ ' + new Date().toLocaleTimeString();
}
setInterval(updateClock, 1000);
updateClock();

log('🔢 Alle Zahlen aus 9 Segmenten extrahierbar', 'num');
log('⌨️  space=Start  q=Quest  x=Reset  a=Auto', 'ok');

</script>
